<body>

    <h1>First Heading</h1>
    <h1>Second Heading</h1>
    <h1>Third Heading</h1>
    <h1>Fourth Heading</h1>
    <h1>Fifth Heading</h1>
    <h1>Sixth Heading</h1>

    <script>
        // 1. Select all h1 elements
        const elements = document.querySelectorAll('h1');

        // 2. Define an array of different colors
        const colors = ['#e74c3c', '#3498db', '#2ecc71', '#9b59b6', '#f39c12', '#e67e22'];

        // 3. Loop through and apply a different color to each
        elements.forEach((el, index) => {
            el.style.backgroundColor = colors[index % colors.length];
        });
