<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }

        body {
            background-color: #f4f5f7;
            display: flex;
            justify-content: center;
            /* align-items: center; */
            /* min-height: 100vh; */
            padding-top: 60px;
        }


        #main-con {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: stretch;
        }

        .box {
            background-color: #f5f5f5;
            border-radius: 16px;
            overflow: hidden;
            flex: 1 1 250px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            min-height: 300px;
            border: 1px solid #eaeaea;
        }

        .box1 {
            padding: 0;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-content {
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-family:Arial, Helvetica, sans-serif;
        }

        h2 {
            margin-top: 40px;
            color: rgb(31, 74, 111);
            font-size: 20px;
            font-weight: 700;
        }

        p {
            color: #486581;
            font-size: 14px;
            line-height: 1.5;
        }

        .btn {
            /* align-self: flex-start; */
            text-align: center;
            width: 130px;
            background-color: #102a43;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 400;
            cursor: pointer;
            margin-bottom: 20px;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #243b53;
        }

        @media screen and (max-width:1032px) {
            .box1 {
                /* width: 100%; */
                flex: 1 1 100%;
            }

            .box {
                height: 250px;

            }
        }
    </style>
</head>

<body>
    <div id="main-con">
        <div class="box box1">
            <img src="./images/computer.png" alt="Laptop preview">
        </div>
        <div class="box box2">
            <div class="card-content">
                <h2>Web Development</h2>
                <p>Learn HTML, CSS and JavaScript with practical projects and responsive website development.</p>
            </div>
            <button class="btn">Learn More</button>
        </div>
        <div class="box box2">
            <div class="card-content">
                <h2>Responsive Design</h2>
                <p>Create websites that automatically adjust their layout according to desktop, tablet and mobile
                    screens.</p>
            </div>
            <button class="btn">Explore</button>
        </div>
    </div>
</body>

</html>
