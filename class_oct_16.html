<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="task-form">
        <input type="text" id="taskInput" placeholder="Enter a new task..." />
        <button id="addBtn">Add Task</button>
    </div>

    <div id="board"></div>
    <script>
        let tasks = [
            { id: 1, title: "Build Login", done: false },
            { id: 2, title: "Test Payment", done: false },
            { id: 3, title: "Fix Navbar", done: true }
        ];

        const board = document.getElementById("board");
        const taskInput = document.getElementById("taskInput");
        const addBtn = document.getElementById("addBtn");

        function render() {
            board.innerHTML = tasks.map(t => `
        <div style="margin-bottom: 8px;">
            <span style="text-decoration: ${t.done ? 'line-through' : 'none'};">
                ${t.title} - ${t.done ? "Done" : "Pending"}
            </span>
            <button data-action="toggle" data-id="${t.id}">Toggle</button>
            <button data-action="delete" data-id="${t.id}">Delete</button>
        </div> 
    `).join("");
        }

        // CREATE: Add a new task
        addBtn.addEventListener("click", () => {
            const title = taskInput.value.trim();
            if (!title) return;

            const newTask = {
                id: Date.now(), // Generates a unique numeric ID based on timestamp
                title: title,
                done: false
            };

            tasks.push(newTask);
            taskInput.value = ""; // Clear input
            render();
        });

        // UPDATE & DELETE: Handle clicks via Event Delegation
        board.addEventListener("click", function (event) {
            const button = event.target.closest("button");
            if (!button || !board.contains(button)) return;

            const id = Number(button.dataset.id);

            if (button.dataset.action === "toggle") {
                const task = tasks.find(t => t.id === id);
                if (task) task.done = !task.done;
            }

            if (button.dataset.action === "delete") {
                tasks = tasks.filter(t => t.id !== id);
            }

            render();
        });

        // Initial render
        render();
    </script>

</body>

</html>
