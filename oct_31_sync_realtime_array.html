        function getData(employeeId) {
            return new Promise((resolve, rejected) => {
                setTimeout(() => {

                        resolve(employee)
                    } else {
                        rejected("Employee Not Found..")
                    }
                }, 5000)
            })
        }

        async function display() {
            console.log("checking data");
            const data = await getData(105);
            console.log(data);
            if (data.name) {

            } else {
                console.log("Process incomplete")
            }
        }
        display()
    </script>
