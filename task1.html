<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java script Calender Task September 29</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;

        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #calender {
            margin: 30px;

            padding: 30px;

            border: 20px solid grey;
            border-right-color: black;
            border-bottom-color: black;
            background-color: aquamarine;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;

        }

        .month {
            width: 300px;
            height: 250px;
            border: 1px solid black;
            padding: 15px;
            text-align: center;
            background: white;
        }

        table {
            width: 100%;
            margin-top: 8px;
            border-collapse: collapse;
            font-size: 12px;
        }

        td,
        th {
            width: 40px;
            height: 30px;
        }

        .january th {
            background-color: violet;
        }

        .february th {
            background-color: rgb(176, 142, 78);
        }

        .march th {
            background-color: rgb(215, 101, 101);
        }

        .april th {
            background-color: greenyellow;
        }

        .may th {
            background-color: goldenrod;
        }

        .june th {
            background-color: burlywood;
        }

        .july th {
            background-color: navajowhite;
        }

        .august th {
            background-color: indianred;
        }

        .september th {
            background-color: palevioletred;
        }

        .october th {
            background-color: hotpink;
        }

        .november th {
            background-color: rgb(142, 87, 173);
        }

        .december th {
            background-color: rgb(129, 85, 21);
        }

        td:hover {
            background-color: rgb(181, 181, 97);
        }

        @media screen and (max-width:950px) {
            #calender {
                margin: 10px;

                padding: 10px;

                border: 10px solid grey;
                border-right-color: black;
                border-bottom-color: black;
                grid-template-columns: 1fr;


            }
        }
    </style>
</head>

    <div id="calender">
        <div class="month january">
            <h4>January</h4>
            <table id="jan_cal">

            </table>
            <script>
                tag = `<tr>
                                <th>S</th>
                                <th>M</th>
                                <th>T</th>
                                <th>W</th>
                                <th>T</th>
                                <th>F</th>
                                <th>S</th>
                           </tr>`;

                for (i = 1; i <= 31; i++) {
                    let tr = ""
                    for (j = 0; j < 7 && i <= 31; j++) {
                        if (i == 1 && j < 5) {
                            tr += "<td></td>"
                        } else {
                            tr += `<td>${i}</td>`
                            i++;
                        }

                    }
                    i--;
                    tag += `<tr>${tr}</tr>`;

                }
                document.getElementById("jan_cal").innerHTML = tag
