<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body {
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            background-color: #f4f7f6;
        }

        .con {
            width: 90%;
            max-width: 1200px;
            background-color: red;
            margin: 40px auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            padding: 10px;
        }

        .card-con {
            flex: 0 1 280px;
            display: flex;
            background-color: white;
            flex-direction: column;
            justify-content: space-between;
            border-radius: 8px;


        }



        .img {
            width: 100%;
            height: 240px;
            object-fit:fill;
        }

        .card-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        h4 {
            color: rgb(1, 1, 23);
            font-weight: 500;
            font-size: 18px;
            margin-bottom: 10px;
        }

        p {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .btn {
            width: 140px;
            height: 40px;
            font-size: 15px;
            background-color: rgb(32, 161, 204);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            border: none;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="con" id="con">
        <a href="#" class="btn">Go somewhere</a>

    </div>
    <script>

        fetch("https://dummyjson.com/products?limit=60")
            .then(response => response.json())
            .then(data => {

                let text = ''
                console.log(data.products)
                data.products.forEach((value, index, arr) => {
                    text += ` 
                <div class="card-con">
                    <img class="img" src="${value.images[0]}" alt="Card image cap">
                    <div class="card-content">
                        <h4 class="card-header">${value.title}</h4>
                        <p class="card-text">${value.description}</p>
                        
                        <a href="#" class="btn">Go somewhere</a>
                    </div>
                </div>
                    `
                })
                document.getElementById("con").innerHTML = text;
            }

            )



    </script>
</body>

</html>
