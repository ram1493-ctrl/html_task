<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>JavaScript</h1>
    <script>
        const arr = [
            ["Ram", 123], ["Raj", 123]
        ]
        function login(username) {
            let validation =false;
            for (let i = 0; i < arr.length; i++) {
                // console.log(arr[i]);
                // console.log(arr[i].includes(username))
                if (arr[i].includes(username)) {
                    validation =true;
                };
            }
            return (validation?"Valid User":"Invalid User");
        }
        console.log(login("Ram"));
        console.log(login("Ramkumar"));
    </script>
</body>

</html>
