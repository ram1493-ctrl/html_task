<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;

        }

        body {
            background-color: #f4f7fc;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .main-box {
            max-width: 1200px;
            width: 90%;
            /* height: 90vh; */
            margin: 0 auto;
            display: flex;
            background-color: white;
            border-radius: 16px;
            padding: 40px;
            gap: 40px;
        }

        #content-box {
            flex: 0 0 60%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }


        #edu {
            display: inline-block;
            background-color: #eef2ff;
            color: #2563eb;
            font-size: 14px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            margin-bottom: 20px;
            width: fit-content;
        }

        h1 {
            font-size: 42px;
            color: #0f172a;
            line-height: 1.2;
            margin-bottom: 16px;
        }

        p {
            color: #475569;
            font-size: 16px;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .btn-con {
            display: flex;
            gap: 16px;
            margin-bottom: 32px;
        }

        button {
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            border: 1px solid #072f6f;
            /* width: 40%; */
        }

        #btn1 {
            background-color: #2563eb;
            color: #ffffff;
        }

        #btn2 {
            background-color: #ffffff;
            color: #072f6f;

        }

        .status-con {
            display: flex;
            align-items: center;
            gap: 24px;
            padding-top: 24px;
        }

        .status {
            display: flex;
            flex-direction: column;
        }

        .status-value {
            font-size: 22px;
            font-weight: 700;
            color: blue;
        }

        .status-heading {
            font-size: 14px;
            color: #475569;
        }

        .status-line {
            width: 1px;
            height: 30px;
            background-color: #e2e8f0;
        }

        #img-box {
            flex: 0 0 40%;
            display: flex;
            /* margin: 20px; */

            align-items: center;
            justify-content: center;
        }

        img {
            width: 100%;
            /* height: auto; */
            height: 100%;
            margin-right: 40px;
            border-radius: 12px;
            object-fit: cover;
        }

        .play-circle {
            width: 24px;
            height: 24px;
            background-color: #2563eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .play-icon {
            width: 15px;
            height: 15px;
            fill: #ffffff;
            margin-left: 1px;
        }

        @media (max-width: 991px) and (min-width: 768px) {
            .main-box {
                flex-direction: column;
                width: 90%;
                padding: 30px;
                gap: 30px;
            }

            #content-box,
            #image-box {
                flex: 0 0 100%;
                width: 100%;
            }

            #btn1,#btn2{
                width: 40%;
            }
        }

        @media (max-width: 767px) {
            .main-box {
                flex-direction: column;
                width: 95%;
                padding: 20px;
                gap: 20px;
            }

            .btn-con {                
                 flex-direction: column;
                 
            }
            #btn1,#btn2{
                width: 80%;
            }
        }
    </style>
</head>

<body>
    <div class="main-box">
        <div id="content-box">
            <span id="edu">Welcome to EduTech</span>
            <h1>Learn Today Build Tomorrow</h1>
            <p>Join thousand of students and devlop real world skill withexpert-led courses.</p>

            <div class="btn-con">
                <button id="btn1">Get Started &rarr;</button>
                <button id="btn2">
                    <span class="play-circle">
                        <svg class="play-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M8 5v14l11-7z" />
                        </svg>
                    </span>
                    Watch video</button>
            </div>

            <div class="status-con">

                <div class="status student">
                    <span class="status-value">10K+</span>
                    <span class="status-heading">Students</span>
                </div>
                <div class="status-line"></div>


                <div class="status course">
                    <span class="status-value">50+</span>
                    <span class="status-heading">Courses</span>
                </div>

                <div class="status-line"></div>


                <div class="status success">
                    <span class="status-value">95%</span>
                    <span class="status-heading">Success Rate</span>
                </div>

            </div>
        </div>
        <div id="img-box">
            <img src="https://th.bing.com/th/id/OIP.ncX2DiSlLR3bc_M6wZgswgHaE8?w=275&h=183&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3"
                alt="Online Learning">
        </div>
    </div>

</body>

</html>
