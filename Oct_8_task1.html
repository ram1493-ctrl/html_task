<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fan Control Animation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            margin-top: 50px;
        }

        .fan-container {
            position: relative;
            width: 400px;
            height: 400px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            background-color: #fff;
        }

        .wing {
            position: absolute;
            width: 150px;
            height: 190px;
            top: 15px;
            left: 125px;
            transform-origin: bottom center;
            z-index: 1;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }


        #wing-up {
            transform: rotate(0deg);
            --base-rotate: 0deg;
        }

        #wing-right {
            transform: rotate(90deg);
            --base-rotate: 90deg;
        }

        #wing-down {
            transform: rotate(180deg);
            --base-rotate: 180deg;
        }

        #wing-left {
            transform: rotate(270deg);
            --base-rotate: 270deg;
        }

        @keyframes spin {
            from {
                transform: rotate(var(--base-rotate));
            }

            to {
                transform: rotate(calc(var(--base-rotate) + 360deg));
            }
        }

        .rotating {
            animation: spin 2s linear infinite;
        }

        .controls {
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0056b3;
        }

        .stop-btn {
            background-color: #dc3545;
        }

        .start-btn {
            background-color: #2b5905;
        }

        .stop-btn:hover {
            background-color: #a71d2a;
        }

        .start-btn:hover {
            background-color: #1c3b02;
        }
    </style>
</head>

<body>

    <h2>Fan Control</h2>

    <div class="fan-container">
        <div id="wing-up" class="wing up"><img
                src="https://tse4.mm.bing.net/th/id/OIP.vkwR7y5iJhQry3DUhUvCTgHaHa?r=0&w=646&h=646&rs=1&pid=ImgDetMain&o=7&rm=3"
                alt="Up Wing"></div>
        <div id="wing-right" class="wing right"><img
                src="https://tse4.mm.bing.net/th/id/OIP.vkwR7y5iJhQry3DUhUvCTgHaHa?r=0&w=646&h=646&rs=1&pid=ImgDetMain&o=7&rm=3"
                alt="Right Wing"></div>
        <div id="wing-down" class="wing down"><img
                src="https://tse4.mm.bing.net/th/id/OIP.vkwR7y5iJhQry3DUhUvCTgHaHa?r=0&w=646&h=646&rs=1&pid=ImgDetMain&o=7&rm=3"
                alt="Down Wing"></div>
        <div id="wing-left" class="wing left"><img
                src="https://tse4.mm.bing.net/th/id/OIP.vkwR7y5iJhQry3DUhUvCTgHaHa?r=0&w=646&h=646&rs=1&pid=ImgDetMain&o=7&rm=3"
                alt="Left Wing"></div>
    </div>

    <div class="controls">
        <button class="start-btn" onclick="startAll()">Start All</button>
        <button onclick="rotateWing('up')">Up</button>
        <button onclick="rotateWing('right')">Right</button>
        <button onclick="rotateWing('down')">Down</button>
        <button onclick="rotateWing('left')">Left</button>
        <button class="stop-btn" onclick="stopAll()">Stop All</button><br>
        <button onclick="speed('up')">Speed +</button>
        <button onclick="speed('down')">Speed -</button>

    </div>

    <script>
        let zIndexCounter = 10;
        let speed_cntrl = 4

        function rotateWing(direction) {
            const targetWing = document.getElementById(`wing-${direction}`);

            targetWing.classList.toggle('rotating');
            if (targetWing.classList.contains('rotating')) {
                targetWing.style.zIndex = ++zIndexCounter;
            } else {
                targetWing.style.zIndex = 1;
            }
        }

        function startAll() {
            stopAll();
            // alert("start");
            // index = 1
            document.querySelectorAll('.wing').forEach(wing => {
                // wing.classList.add('rotating');
                wing.style.animation = `spin ${speed_cntrl}s linear infinite`;
                // index++;
                wing.style.zIndex = 1;
            });
        }


        function speed(cntrl) {
            // alert("speeed cntrl");

            if (cntrl == "up") {
                speed_cntrl -= 0.5;
                if (speed_cntrl <= 0) {
                    speed_cntrl = 0.1;
                }
            } else {
                speed_cntrl += 0.5;
                if (speed_cntrl >= 10) {
                    speed_cntrl = 10;
                }
            }

            document.querySelectorAll('.wing').forEach(wing => {
                wing.style.animation = `spin ${speed_cntrl}s linear infinite`
            });

        }


        function stopAll() {
            // alert("stop");

            document.querySelectorAll('.wing').forEach(wing => {

                if (wing.classList.contains('rotating')) {
                    wing.classList.toggle('rotating');
                    // alert("wing stop");
                }
                wing.style.animation = ``;
                wing.style.zIndex = 1;
                speed_cntrl = 4;
            });
        }



    </script>

</body>

</html>
