        const employees = [

            { id: 105, name: "Vijay", department: "IT", salary: 55000, performance: 68, experience: 2, active: true, skills: ["JavaScript", "HTML"] },
            { id: 106, name: "Meena", department: "Finance", salary: 82000, performance: 91, experience: 7, active: true, skills: ["SQL", "Python"] },
            { id: 107, name: "Suresh", department: "HR", salary: 42000, performance: 62, experience: 3, active: false, skills: ["Recruitment"] },
            { id: 108, name: "Nithya", department: "IT", salary: 88000, performance: 89, experience: 5, active: true, skills: ["React", "Node.js"] },
            { id: 109, name: "Praveen", department: "Sales", salary: 60000, performance: 75, experience: 4, active: true, skills: ["Communication", "CRM"] },

            { id: 112, name: "Anitha", department: "IT", salary: 105000, performance: 98, experience: 10, active: true, skills: ["Java", "AWS", "SQL"] }

        function employees_sort_by(obj, value, order) {
            switch (order) {
                case "Asc":
                    return [...obj].sort((val1, val2) => val1[value] - val2[value]);
                case "Desc":
                    return [...obj].sort((val1, val2) => val2[value] - val1[value]);

            }
        }

        function employees_filter_by(obj, value, symbol, expected) {
            return obj.filter((val, ind, arr) => {
                let filter = val[value]

                switch (symbol) {
                    case '>':
                        return filter > expected
                    case '>=':
                        return filter >= expected
                    case '<':
                        return filter < expected
                    case '<=':
                        return filter <= expected
                    case '==':
                        return filter == expected
                    case '!=':
                        return filter != expected
                    case 'includes':
                        return filter.includes(expected);
                }

            })
        }
        const unchangedemployees = structuredClone(employees);

        function employees_reduce_by(obj, value) {
            return obj.reduce((sum, val) => {
                return sum + val[value]
            }, 0)
        }

        function employees_dataset_validation() {
            (unchangedemployees.length == employees.length) ? console.log("original employee dataset remains unchanged") : console.log("original employee dataset changed");
        }
