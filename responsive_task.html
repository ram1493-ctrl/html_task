<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        nav {
            width: 100%;
            height: 10vh;
            background-color: aquamarine;
            display: flex;
        }

        #logo {
            width: 250px;
            height: 100%;
            /* background-color: goldenrod; */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #logo img {
            width: 30px;
            height: 50px;
        }

        #logo span {
            font-size: 30px;
            font-weight: 600;
            margin-left: 15px;
            font-family: sans-serif;
        }

        .ul {
            height: 100%;
            width: 500px;
            /* background-color: blue; */
            display: flex;
            align-items: center;
        }

        .ul>li {
            /* background-color: olive; */
            list-style-type: none;
            padding: 15px 20px;
            /* border: 1px solid black; */
        }

        .link {
            /* background-color: rgb(128, 150, 126); */
            text-decoration: none;
            color: black;
        }

        #search {
            width: 350px;
            height: 100%;
            /* background-color: yellow; */
            display: flex;
            justify-content: center;
            align-items: center;
            margin-left: auto;

        }

        #searchicon {
            /* background-color: red; */
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
            color: black;
        }

        #btn {
            background-color: #0168f9;
            font-size: larger;
            padding: 13px 25px;
            border: none;
            color: black;
            border-radius: 15px;
            margin-left: 10px;
            width: auto;
        }

        .hero-section {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin: 10px;

            background-color: #f1f7fd;
        }

        .con {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: start;
            gap: 10px;
            width: 70vw;
            height: 45vh;
            padding: 20px 40px;
            margin: 10px 30px;
            background-color: #f1f7fd;
        }

        .sub-heading {
            color: #006bff;
            font-size: 15px;
            letter-spacing: 1px;
        }

        .heading {
            font-size: 47px;
            font-weight: 700;
            line-height: 1.1;
        }

        .description {
            font-size: 18px;
            line-height: 1.4;
        }

        button {
            background-color: #006bff;
            color: white;
            font-size: 18px;
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid #006bff;
            margin-right: 10px;
        }

        .button2 {
            background-color: white;
            color: #006bff;
        }

        .con-img {
            margin: auto;
        }

        .con-img>img {
            width: 30vw;
            height: 45vh;
        }

        #menu-bar {
            display: none;
            cursor: pointer;
            padding: 15px;
            ;
        }

        @media screen and (max-width:760px) {
            #menu-bar {
                display: block;
                margin-left: auto;
            }

            #link-container {
                display: block;
                top: 10vh;
                width: 100%;
                position: absolute;
                /* left: 0px; */
                left: -100%;

                transition: all 0.8s linear;


            }

            .ul {
                flex-direction: column;
                width: 100%;
                padding: 15px;
                margin: 0px;
                background-color: rgb(224, 211, 211);

            }

            li {
                width: 100%;
                padding: 12px 25px;
            }

            .hero-section {
                display: block;
            }

            .con {
                width: 100%;
                height: auto;
            }

            #girl_img {
                margin: 10px 30px;
                width: 100%;
            }


        }
    </style>


</head>


<body>
    <nav id="main-container">
        <div id="logo">
            <img id="imaglogo"
                src="https://www.bing.com/th/id/OIP.0X4zKcE-s3aM3eKCpWb-JQHaEW?w=193&h=135&c=8&rs=1&qlt=90&o=6&dpr=1.3&pid=ImgAns&rm=2"
                alt="">
            <span>EduPro</span>
        </div>
        <div id="link-container">
            <ul class="ul" id="ul">
                <li><a href="" class="link">Home</a></li>
                <li><a href="" class="link">About</a></li>
                <li><a href="" class="link">Course</a></li>
                <li><a href="" class="link">Blog</a></li>
                <li><a href="" class="link">Contact</a></li>
            </ul>
        </div>
        <div id="search">
            <i id="searchicon" class="fa-solid fa-magnifying-glass"></i>
            <button id="btn">Get Started</button>
        </div>

        <img onclick="method()" id="menu-bar" class="menu-bar"
            src="https://cdn-icons-png.flaticon.com/128/2516/2516745.png" alt="Menu Icon">
    </nav>
    <script>
        let menu_bar = false;
        function method() {


            if (!menu_bar) {
                // alert("Hi");
                menu_bar = true;
                document.getElementById("link-container").style.left = "0px";
                return;
            }
            if (menu_bar) {
                // alert("Bye");
                menu_bar = false;
                document.getElementById("link-container").style.left = "-100%";
                return;
            }
        }

    </script>

    <section class="hero-section">
        <div class="con">
            <h3 class="sub-heading">LEARN ANYTHING, ANYWHERE</h3>
            <h1 class="heading">Build Your Future With Better Learning</h1>
            <p class="description">Join thousands of students and learn new skills with our expert insturctors.</p>
            <div class="btn-group">
                <button>Explore Courses</button>
                <button class="button button2">Watch Video</button>
            </div>
        </div>
        <div class="con-img">
            <img id="girl_img" src="./girl.jpeg" />
        </div>
    </section>
</body>

</html>
